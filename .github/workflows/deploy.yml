name: Publier Deaflix Writer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6
      - name: Préparer Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Installer
        run: npm ci
      - name: Vérifier et construire
        run: npm run build
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
